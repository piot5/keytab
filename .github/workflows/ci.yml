name: CI

on:
  push:
  pull_request:
  # Manual start: Actions -> CI -> "Run workflow" or `gh workflow run ci.yml`.
  # This lets you re-run a run without a commit (e. g. after deleted red runs)
  # — the code state remains unchanged.
  workflow_dispatch:

jobs:
  # Docs drift gate: runs first and without a toolchain (no Gradle, no SDK),
  # so README / CHANGELOG / version info cannot drift from the code.
  # Checks only what is unambiguously machine-decidable: versionName ==
  # CHANGELOG head == fastlane changelog, and README has no hard-coded version.
  # Details: scripts/check_docs_drift.sh
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Check docs drift
        run: sh scripts/check_docs_drift.sh

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runners ship an Android SDK (ANDROID_HOME is set)
      - name: Assemble + Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: keytab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test report artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn

  # Static analysis: Android Lint + detekt. Lint blocks errors,
  # detekt prevents new code smells via baseline.
  static-analysis:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Android Lint
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: detekt
        run: |
          chmod +x gradlew
          ./gradlew :app:detektDebug --no-daemon --stacktrace

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/detekt/**
          if-no-files-found: warn

  # Coverage gate: koverVerify fails if line coverage is below 60 %
  # or branch coverage below 45 %.
  coverage:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      # coverageGate = koverHtmlReport + koverLog + koverVerify
      # Thresholds: 60 % lines / 45 % branches.
      - name: Coverage gate
        run: |
          chmod +x gradlew
          ./gradlew :app:coverageGate --no-daemon --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-report
          path: app/build/reports/kover/**
          if-no-files-found: warn

  # Instrumented tests on real emulator (API 34, KVM-accelerated)
  instrumented:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      # KVM group permissions for hardware-accelerated emulator
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (emulator API 34)
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh scripts/run_instrumented_tests.sh

      - name: Upload instrumented report artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/**
          if-no-files-found: warn

      # Full logcat of the run. Job log shows only start and end; for
      # "IME window did not come up" you need the state *during* the tests.
      - name: Upload logcat of run (on failure)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: instrumented-logcat
          path: /tmp/keytab-instrumented.logcat
          if-no-files-found: warn
