name: CI

on:
  push:
  pull_request:
  # Manual start: Actions -> CI -> "Run workflow" or `gh workflow run ci.yml`.
  # This lets you re-run a run without a commit (e. g. after deleted red runs)
  # — the code state remains unchanged.
  workflow_dispatch:

jobs:
  # Docs drift gate: runs first and without a toolchain (no Gradle, no SDK),
  # so README / CHANGELOG / version info cannot drift from the code.
  # Checks only what is unambiguously machine-decidable: versionName ==
  # CHANGELOG head == fastlane changelog, and README has no hard-coded version.
  # Details: scripts/check_docs_drift.sh
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Check docs drift
        run: sh scripts/check_docs_drift.sh

      # Zweiter Gate ohne Toolchain: auf einem Tag-Push muss der Tag-Name zur
      # Version im getaggten Baum passen (v0.19 zeigte auf 0.20-Code → F-Droid
      # konnte die Metadaten nicht aktualisieren, GitHub-Issue #1). Details:
      # scripts/check_release_tag.sh; alle Tags: ... --audit
      - name: Release-Tag ↔ Version
        run: sh scripts/check_release_tag.sh

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runners ship an Android SDK (ANDROID_HOME is set)
      - name: Assemble + Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: keytab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test report artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn

  # Static analysis: Android Lint + detekt. Lint blocks errors,
  # detekt prevents new code smells via baseline.
  static-analysis:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Android Lint
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: detekt
        run: |
          chmod +x gradlew
          ./gradlew :app:detektDebug --no-daemon --stacktrace

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/detekt/**
          if-no-files-found: warn

  # Coverage gate: koverVerify fails if line coverage is below 60 %
  # or branch coverage below 45 %.
  coverage:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      # coverageGate = koverHtmlReport + koverLog + koverVerify
      # Thresholds: 60 % lines / 45 % branches.
      - name: Coverage gate
        run: |
          chmod +x gradlew
          ./gradlew :app:coverageGate --no-daemon --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-report
          path: app/build/reports/kover/**
          if-no-files-found: warn

# ---------------------------------------------------------------------------
# Kein instrumented-Job in der CI (Entscheidung 2026-10-29).
#
# Der Job lief auf einem API-34-Emulator und war seit dem 2026-10-22 dauerhaft
# rot: der Emulator ist so langsam, dass der IME-Dienst das Fenster nicht
# rechtzeitig aufbaut („keyboard did not become visible") — die Fehlermeldung
# war damit ein Emulator-Artefakt, kein Produktbefund. Drei Commits lang wurde
# am Test statt am Produkt gearbeitet.
#
# Die instrumentierte Suite laeuft deshalb **nur noch auf echtem Geraet**
# (device-first):
#
#     sh scripts/test_on_device.sh          # baut, installiert (sha256-geprueft),
#                                           # prueft versionCode, weckt/entsperrt
#                                           # das Geraet, faehrt die Suite, stellt
#                                           # den IME wieder her
#
# Der Emulator-Weg bleibt als lokales Werkzeug erhalten
# (scripts/run_instrumented_tests.sh, mit eigenem Zeitbudget und Logcat-Abzug),
# ist aber nicht mehr Teil der Pipeline.
# ---------------------------------------------------------------------------
