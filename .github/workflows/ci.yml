name: CI

on:
  push:
  pull_request:

jobs:
  # Doku-Drift-Gate: laeuft zuerst und ohne Toolchain (kein Gradle, kein SDK),
  # damit README/CHANGELOG/Versionsangaben nicht vom Code wegdriften.
  # Geprueft werden eindeutig maschinell entscheidbare Dinge: versionName ==
  # CHANGELOG.md-Kopf == fastlane-Changelog, die im README genannten
  # Testzahlen/Suite-Namen gegen app/src/test, und dass die Version nur an
  # einer Stelle definiert ist. Details: scripts/check_docs_drift.sh
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Doku-Drift pruefen
        run: sh scripts/check_docs_drift.sh

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: JDK 17 einrichten
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-Runner bringen ein Android-SDK mit (ANDROID_HOME ist gesetzt)
      - name: Assemble + Unit-Tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: keytab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Test-Report als Artifact hochladen (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn

  # Statische Analyse: Android Lint + detekt. Lint blockiert Fehler,
  # detekt verhindert mit der Baseline neue Code-Smells.
  static-analysis:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: JDK 17 einrichten
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Android Lint
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: detekt
        run: |
          chmod +x gradlew
          ./gradlew :app:detektDebug --no-daemon --stacktrace

      - name: Analyse-Reports hochladen
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/detekt/**
          if-no-files-found: warn

  # Coverage-Gate: koverVerify schlägt fehl, wenn die Zeilen-Coverage unter
  # 60 % oder die Branch-Coverage unter 45 % fällt.
  coverage:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: JDK 17 einrichten
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      # coverageGate = koverHtmlReport + koverLog + koverVerify
      # Schwellen: 60 % Zeilen / 45 % Branches.
      - name: Coverage-Gate
        run: |
          chmod +x gradlew
          ./gradlew :app:coverageGate --no-daemon --stacktrace

      - name: Coverage-Report als Artifact hochladen
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-report
          path: app/build/reports/kover/**
          if-no-files-found: warn

  # Instrumentierte Tests auf echtem Emulator (API 34, KVM-beschleunigt)
  instrumented:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: JDK 17 einrichten
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      # KVM-Gruppenrechte für hardware-beschleunigten Emulator
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented-Tests (Emulator API 34)
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Instrumented-Report als Artifact hochladen (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/**
          if-no-files-found: warn