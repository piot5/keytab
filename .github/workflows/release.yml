name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Doku-Drift pruefen
        run: sh scripts/check_docs_drift.sh

      - name: JDK 17 einrichten
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Keystore aus Secrets wiederherstellen
        run: |
          echo "${{ secrets.KEYTAB_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keytab-release.jks"

      - name: Signierte Release-APK bauen
        env:
          KEYTAB_KEYSTORE: ${{ runner.temp }}/keytab-release.jks
          KEYTAB_KEYSTORE_PASSWORD: ${{ secrets.KEYTAB_KEYSTORE_PASSWORD }}
          KEYTAB_KEY_ALIAS: ${{ secrets.KEYTAB_KEY_ALIAS }}
          KEYTAB_KEY_PASSWORD: ${{ secrets.KEYTAB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256

      - name: Release-Artefakte anzeigen
        run: |
          cat app/build/outputs/apk/release/output-metadata.json
          cat app/build/outputs/apk/release/app-release.apk.sha256

      - name: Release Notes aus Fastlane-Changelog lesen
        id: notes
        run: |
          VC=$(sed -n 's/.*"versionCode": \([0-9]*\).*/\1/p' app/build/outputs/apk/release/output-metadata.json | head -1)
          CL="fastlane/metadata/android/en-US/changelogs/${VC}.txt"
          if [ -f "$CL" ]; then
            { printf 'body<<EOF\n'; awk 1 "$CL"; printf 'EOF\n'; } >> "$GITHUB_OUTPUT"
          else
            { echo "body<<EOF"; echo "Release ${GITHUB_REF_NAME}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release mit APK erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="KeyTab-${GITHUB_REF_NAME#v}.apk"
          SUM="KeyTab-${GITHUB_REF_NAME#v}.apk.sha256"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          cp app/build/outputs/apk/release/app-release.apk.sha256 "$SUM"
          # Idempotent: existiert das Release schon (Tag neu gepusht), Assets nur ersetzen
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$APK" "$SUM"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KeyTab ${GITHUB_REF_NAME}" \
              --notes "${{ steps.notes.outputs.body }}" \
              "$APK" "$SUM"
          fi
