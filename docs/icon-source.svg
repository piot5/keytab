<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Hintergrund / Icon Canvas -->
  <rect width="512" height="512" rx="112" fill="#121212"/>

  <!-- Flacheres Chevron + Cursor (90° nach links gedreht) -->
  <g transform="rotate(-90 256 256)">
    <!-- Flacheres Chevron -->
    <path d="M 190 128
             L 270 256
             L 190 384
             L 235 384
             L 315 256
             L 235 128 Z"
          fill="#2196F3"
          stroke="#2196F3"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Grüner Cursor-Balken (55px Breite) -->
    <rect x="355" y="128" width="55" height="256" rx="10" fill="#4CAF50"/>
  </g>
</svg>
